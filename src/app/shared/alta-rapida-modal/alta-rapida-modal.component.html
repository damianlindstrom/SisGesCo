<div class="modal-overlay" *ngIf="visible">
  <div class="modal-content">
    <h3>➕ {{ titulo }}</h3>
    <div class="campos">
      <ng-container *ngFor="let campo of campos">
        <!-- Campos de texto, número y select -->
        <ng-container *ngIf="$any(campo).tipo !== 'checkbox'">
          <label>{{ campo.label }}{{ campo.requerido ? ' *' : '' }}</label>
          <input
            *ngIf="$any(campo).tipo === 'text'"
            type="text"
            [placeholder]="campo.placeholder ?? ''"
            [(ngModel)]="valores[campo.key]">
          <input
            *ngIf="$any(campo).tipo === 'number'"
            type="number"
            step="any"
            [placeholder]="campo.placeholder ?? ''"
            [(ngModel)]="valores[campo.key]">
          <select *ngIf="$any(campo).tipo === 'select'" [(ngModel)]="valores[campo.key]">
            <option value="">— Seleccioná —</option>
            <option *ngFor="let op of campo.opciones" [value]="op.value">{{ op.label }}</option>
          </select>
        </ng-container>

        <!-- Campo checkbox booleano -->
        <div *ngIf="$any(campo).tipo === 'checkbox'" style="margin: 12px 0; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" [id]="'chk_' + campo.key" [(ngModel)]="valores[campo.key]">
          <label [for]="'chk_' + campo.key" style="margin: 0; cursor: pointer; font-weight: normal;">{{ campo.label }}</label>
        </div>
      </ng-container>
    </div>
    <div class="acciones">
      <button type="button" class="btn-cancelar" (click)="onCerrar()">Cancelar</button>
      <button type="button" class="btn-guardar" [disabled]="!esValido || guardando" (click)="onGuardar()">
        {{ guardando ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </div>
</div>
